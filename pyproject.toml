[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brightdata-rag"
version = "0.1.1"
description = "Async-first website-to-RAG toolkit powered by Bright Data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "brightdata-rag contributors"}]
dependencies = [
    "httpx>=0.27,<1", "pydantic>=2.7,<3", "typer>=0.12,<1",
    "beautifulsoup4>=4.12,<5", "markdownify>=1.1,<2",
]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
openai = ["openai>=1.66,<3"]
chroma = ["chromadb>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1"]

[project.scripts]
brightdata-rag = "brightdata_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brightdata_rag"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CONTRIBUTING.md", "CHANGELOG.md",
           "LICENSE", "pyproject.toml", ".github", ".env.example", ".gitignore", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/brightdata_rag/cli.py" = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
